spring.application.name=developer-portal
server.port=8080

# ---- MySQL (override with env vars DB_USERNAME / DB_PASSWORD) ----
spring.datasource.url=jdbc:mysql://localhost:3306/devportal?createDatabaseIfNotExist=true&useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
spring.datasource.username=${DB_USERNAME:root}
spring.datasource.password=${DB_PASSWORD:root}
spring.jpa.hibernate.ddl-auto=update
spring.jpa.open-in-view=false
spring.jpa.show-sql=false
spring.jackson.serialization.write-dates-as-timestamps=false

# ---- Security ----
jwt.secret=${JWT_SECRET:change-this-secret-key-to-at-least-32-characters-long}
jwt.expiration-ms=86400000
cors.allowed-origins=http://localhost:5173,http://localhost:3000

# ---- GitHub integration ----
github.api-url=https://api.github.com
# Optional personal access token (raises rate limit from 60 to 5000 requests/hour)
github.token=${GITHUB_TOKEN:}
# Comma-separated GitHub users/organisations to discover. More can be added from the UI.
github.owners=${GITHUB_OWNERS:octocat}
github.max-repos-per-owner=50

# ---- Synchronisation ----
sync.enabled=true
# Spring cron: second minute hour day month weekday  (default = every hour)
sync.cron=0 0 * * * *
sync.auto-create-services=true
sync.inactive-after-days=180
